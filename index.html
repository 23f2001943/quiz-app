<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quiz App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background: #f5f5f5;
    }
    section {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin: 6px 0;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Quiz</h1>

  <section>
    <h2>Which web browser is made by Google?</h2>
    <label><input type="radio" name="q1"> Chrome</label>
    <label><input type="radio" name="q1"> Firefox</label>
    <label><input type="radio" name="q1"> Safari</label>
    <label><input type="radio" name="q1"> Opera</label>
    <label><input type="radio" name="q1"> Edge</label>
  </section>

  <section>
    <h2>Which company developed Windows?</h2>
    <label><input type="radio" name="q2"> Apple</label>
    <label><input type="radio" name="q2"> Microsoft</label>
    <label><input type="radio" name="q2"> Google</label>
    <label><input type="radio" name="q2"> IBM</label>
  </section>

  <section>
    <h2>Which language is used to style web pages?</h2>
    <label><input type="radio" name="q3"> HTML</label>
    <label><input type="radio" name="q3"> CSS</label>
    <label><input type="radio" name="q3"> Java</label>
    <label><input type="radio" name="q3"> Python</label>
  </section>

</body>
</html>
